<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Assessoria DC &amp; HC</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1f3a5f" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light; --bg: #f4f4f1; --surface: #fcfcfb; --border: #e2e1dc; --text: #16181d; --muted: #76756f; --accent: #1f3a5f; --on-accent: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #2f2f2c; --text: #f0efec; --muted: #9a998f; --accent: #9cbcf0; --on-accent: #121211; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #2f2f2c; --text: #f0efec; --muted: #9a998f; --accent: #9cbcf0; --on-accent: #121211; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .mark { font-weight: 800; font-size: 12px; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 8px; }
    .mark span { opacity: .65; margin: 0 2px; }
    h1 { font-size: 16px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    .frame { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; height: min(80vh, 760px); }
    .frame.slides { height: auto; aspect-ratio: 16 / 9.6; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .empty { color: var(--muted); text-align: center; padding: 60px 16px; }
    @media (max-width: 720px) { header { padding: 10px 16px; } main { padding: 12px 16px; } .frame { height: 75vh; } }
  </style>
</head>
<body>
  <header>
    <span class="mark">DC<span>&amp;</span>HC</span>
    <div><h1>Assessoria DC &amp; HC</h1><div class="sub" id="title"></div></div>
  </header>
  <main id="content"></main>
  <script>
    // Página pública: mostra apenas os ficheiros indicados no link (partilhados como "qualquer pessoa com o link").
    const p = new URLSearchParams(location.search);
    const title = p.get('t') || '';
    document.getElementById('title').textContent = title;
    if (title) document.title = title + ' · Assessoria DC & HC';
    const main = document.getElementById('content');
    const files = (p.get('f') || '').split(',').map((x) => x.split('~')).filter(([id]) => /^[\w-]{10,}$/.test(id || ''));
    if (!files.length) main.innerHTML = '<div class="empty">Link inválido ou sem conteúdo.</div>';
    for (const [id, kind] of files) {
      const box = document.createElement('div');
      box.className = 'frame' + (kind === 's' ? ' slides' : '');
      const f = document.createElement('iframe');
      f.src = kind === 's' ? `https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false`
        : kind === 'd' ? `https://docs.google.com/document/d/${id}/preview`
        : `https://drive.google.com/file/d/${id}/preview`;
      f.allow = 'fullscreen';
      f.allowFullscreen = true;
      f.title = title || 'Apresentação';
      box.appendChild(f);
      main.appendChild(box);
    }
  </script>
</body>
</html>
