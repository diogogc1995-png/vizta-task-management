<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Budgets</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">Project Budgets</div>
    <div class="status" id="status">Loading…</div>
    <div class="actions">
      <div class="menu">
        <button type="button" id="btn-pdf">Export PDF ▾</button>
        <div class="menu-list">
          <button type="button" data-pdf="one">This project</button>
          <button type="button" data-pdf="all">All projects</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" id="btn-xlsx">Export Excel ▾</button>
        <div class="menu-list">
          <button type="button" data-xlsx="one">This project</button>
          <button type="button" data-xlsx="all">All projects</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar no-print" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>

  <div id="print-area" class="print-only"></div>
  <div id="toast" class="toast no-print" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
