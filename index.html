                    (dragProjectId === pid ? "opacity-40 " : "") +
                    (!showDashboard && selectedProject === pid ? "bg-white/10 text-white" : "text-slate-300 hover:bg-white/5")
                  }
                >
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: p.color }} />
                  <span className="flex-1 truncate">{p.name}</span>
                  <span className="text-[11px] text-slate-500">{count}</span>
                </button>
              );
            };
            const unfiled = projectOrder.filter((pid) => !folderAssignments[pid]);
            return (
              <>
                {folders.map((f) => {
                  const projectIds = projectOrder.filter((pid) => folderAssignments[pid] === f.id);
                  const collapsed = collapsedFolders[f.id];
                  const isDropTarget = dragProjectId && dragOverFolder === f.id;
                  return (
                    <div
                      key={f.id}
                      onDragOver={(e) => {
                        if (!dragProjectId) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = "move";
                        if (dragOverFolder !== f.id) setDragOverFolder(f.id);
                      }}
                      onDragLeave={(e) => {
                        if (!e.currentTarget.contains(e.relatedTarget)) setDragOverFolder(undefined);
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        handleDropProjectOnFolder(f.id);
                      }}
                      className={"rounded-lg " + (isDropTarget ? "bg-[#F26641]/15 ring-1 ring-[#F26641]/40" : "")}
                    >
                      <button
                        onClick={() => setCollapsedFolders((prev) => ({ ...prev, [f.id]: !prev[f.id] }))}
                        onContextMenu={(e) => openFolderContextMenu(e, f)}
                        className="w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-white/5"
                      >
                        <IconChevronDown size={12} className={"transition-transform " + (collapsed ? "-rotate-90" : "")} />
                        <IconFolder size={12} />
                        <span className="flex-1 text-left truncate">{f.name}</span>
                        <span className="text-[10px]">{projectIds.length}</span>
                      </button>
                      {!collapsed && <div className="pl-3">{projectIds.map(renderProjectButton)}</div>}
                      {isDropTarget && projectIds.length === 0 && (
                        <p className="text-[10px] text-slate-400 px-2 pb-1.5 pl-6">Largar aqui para mover para "{f.name}"</p>
                      )}
                    </div>
                  );
                })}
                <div
                  onDragOver={(e) => {
                    if (!dragProjectId) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    if (dragOverFolder !== "__none__") setDragOverFolder("__none__");
                  }}
                  onDragLeave={(e) => {
                    if (!e.currentTarget.contains(e.relatedTarget)) setDragOverFolder(undefined);
                  }}
                  onDrop={(e) => {
                    e.preventDefault();
                    handleDropProjectOnFolder(null);
                  }}
                  className={
                    "rounded-lg " +
                    (folders.length > 0 ? "mt-1 pt-1 " : "") +
                    (dragProjectId && dragOverFolder === "__none__" ? "bg-[#F26641]/15 ring-1 ring-[#F26641]/40" : "")
                  }
                >
                  {folders.length > 0 && dragProjectId && (
                    <p className="text-[10px] uppercase tracking-wide text-slate-500 px-2 pb-1">Sem pasta</p>
                  )}
                  {unfiled.map(renderProjectButton)}
                  {dragProjectId && unfiled.length === 0 && folders.length > 0 && (
                    <p className="text-[10px] text-slate-400 px-2 py-1.5">Largar aqui para tirar da pasta</p>
                  )}
                </div>
              </>
            );
          })()}
        </div>
        <div className="px-4 py-3 border-t border-white/10 flex items-center gap-2">
          <div className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-xs font-medium text-white shrink-0">
            {initials(profile.name)}
          </div>
          <div className="flex-1 min-w-0">
            <p className="text-xs text-white truncate">{profile.name}</p>
            <p className="text-[11px] text-slate-400 truncate">{profile.email}</p>
          </div>
          <button onClick={() => sb.auth.signOut()} className="text-slate-400 hover:text-white" title="Terminar sessão">
            <IconLogOut size={15} />
          </button>
        </div>
      </aside>

      <main className="flex-1 flex flex-col overflow-hidden">
        {showDashboard ? (
          <>
            <div className="flex items-center gap-2 px-4 sm:px-6 py-4 border-b border-slate-200 bg-white">
              <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-slate-500 hover:text-slate-700 -ml-1 p-1" title="Menu">
                <IconMenu size={20} />
              </button>
              <IconLayoutDashboard size={16} className="text-slate-700 shrink-0" />
              <h1 className="text-base font-semibold text-slate-900 truncate">O Meu Dashboard</h1>
            </div>
            <div className="flex-1 overflow-y-auto">
              <DashboardView
                tasks={myTasks}
                projects={projects}
                onOpen={(t) => {
                  setSelectedProject(t.project);
                  setShowDashboard(false);
                  openTask(t);
                }}
              />
            </div>
          </>
        ) : (
          <>
            <div className="flex flex-wrap items-center gap-x-3 gap-y-2 px-4 sm:px-6 py-3 border-b border-slate-200 bg-white">
              <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-slate-500 hover:text-slate-700 -ml-1 p-1 shrink-0" title="Menu">
                <IconMenu size={20} />
              </button>
              <div className="flex items-center gap-2 min-w-0 flex-1">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: project ? project.color : "#ccc" }} />
                <h1 className="text-base font-semibold text-slate-900 truncate">{project ? project.name : "Sem projetos"}</h1>
                {project && project.owner_id === session.user.id && (
                  <button onClick={() => setShowEditProject(true)} className="text-slate-300 hover:text-slate-500 shrink-0" title="Editar projeto">
                    <IconEdit size={14} />
                  </button>
                )}
              </div>
              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                <div className="relative">
                  <IconSearch size={14} className="absolute left-2.5 top-2.5 text-slate-400" />
                  <input
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Procurar"
                    className="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] w-28 sm:w-40"
                  />
                </div>
                <button
                  onClick={() => selectedProject && setShowMembers(true)}
                  disabled={!selectedProject}
                  className="flex items-center gap-1.5 text-sm text-slate-600 px-2.5 sm:px-3 py-1.5 rounded-lg font-medium border border-slate-200 hover:bg-slate-50 disabled:opacity-40"
                  title="Equipa"
                >
                  <IconUsers size={14} /> <span className="hidden sm:inline">Equipa</span>
                </button>
                <NotificationsBell userId={session.user.id} onOpenTask={handleOpenNotificationTask} />
                <button
                  onClick={() => selectedProject && setModalTask({ column: "todo", __new: true })}
                  disabled={!selectedProject}
                  className="flex items-center gap-1.5 text-sm text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-medium disabled:opacity-40"
                  style={{ backgroundColor: "#F26641" }}
                  title="Nova tarefa"
                >
                  <IconPlus size={14} /> <span className="hidden sm:inline">Nova tarefa</span>
                </button>
              </div>
            </div>
            {selectedProject && (
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 px-4 sm:px-6 py-2 border-b border-slate-200 bg-white">
                <div className="flex items-center gap-1 bg-slate-100 rounded-lg p-1 w-fit">
                  <button
                    onClick={() => setView("kanban")}
                    className={
                      "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-md font-medium " +
                      (view === "kanban" ? "bg-white shadow-sm text-slate-900" : "text-slate-500")
                    }
                  >
                    <IconKanban size={13} /> Kanban
                  </button>
                  <button
                    onClick={() => setView("lista")}
                    className={
                      "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-md font-medium " +
                      (view === "lista" ? "bg-white shadow-sm text-slate-900" : "text-slate-500")
                    }
                  >
                    <IconList size={13} /> Lista
                  </button>
                  <button
                    onClick={() => setView("calendario")}
                    className={
                      "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-md font-medium " +
                      (view === "calendario" ? "bg-white shadow-sm text-slate-900" : "text-slate-500")
                    }
                  >
                    <IconCalendar size={13} /> Calendário
                  </button>
                </div>
                <div className="flex items-center gap-2 overflow-x-auto pb-1 -mb-1 sm:pb-0 sm:mb-0">
                  <IconFilter size={13} className="text-slate-400 shrink-0" />
                  <select
                    value={filterAssignee}
                    onChange={(e) => setFilterAssignee(e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 outline-none bg-white shrink-0"
                  >
                    <option value="">Todos os responsáveis</option>
                    {assigneeOptions.map((m) => (
                      <option key={m.email} value={m.email}>
                        {displayName(m)}
                      </option>
                    ))}
                  </select>
                  <select
                    value={filterPriority}
                    onChange={(e) => setFilterPriority(e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 outline-none bg-white shrink-0"
                  >
                    <option value="">Todas as prioridades</option>
                    {Object.entries(PRIORITY).map(([k, v]) => (
                      <option key={k} value={k}>
                        {v.label}
                      </option>
                    ))}
                  </select>
                  <select
                    value={filterTagId}
                    onChange={(e) => setFilterTagId(e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 outline-none bg-white shrink-0"
                  >
                    <option value="">Todas as etiquetas</option>
                    {tags.map((t) => (
                      <option key={t.id} value={t.id}>
                        {t.name}
                      </option>
                    ))}
                  </select>
                  <select
                    value={filterColumn}
                    onChange={(e) => setFilterColumn(e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 outline-none bg-white shrink-0"
                  >
                    <option value="">Todos os status</option>
                    {COLUMN_DEFS.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.title}
                      </option>
                    ))}
                  </select>
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 outline-none bg-white shrink-0"
                  >
                    <option value="">Sem ordenação</option>
                    <option value="due">Prazo (mais próximo)</option>
                    <option value="priority">Prioridade (mais alta)</option>
                    <option value="title">Título (A-Z)</option>
                  </select>
                </div>
              </div>
            )}
            {!selectedProject ? (
              <div className="flex-1 flex flex-col items-center justify-center text-center px-6">
                <p className="text-slate-500 text-sm mb-3">Ainda não tens projetos.</p>
                <button
                  onClick={() => setShowNewProject(true)}
                  className="text-sm text-white px-4 py-2 rounded-lg font-medium"
                  style={{ backgroundColor: "#F26641" }}
                >
                  Criar o primeiro projeto
                </button>
              </div>
            ) : view === "kanban" ? (
              <div className="flex-1 overflow-x-auto px-4 sm:px-6 py-4">
                <div className="flex gap-3 h-full min-w-min">
                  {COLUMN_DEFS.map((col) => (
                    <Column
                      key={col.id}
                      col={col}
                      tasks={projectTasks.filter((t) => t.column === col.id)}
                      onOpen={openTask}
                      onDragStart={handleDragStart}
                      onDrop={handleDrop}
                      onAddTask={handleAddTaskInColumn}
                    />
                  ))}
                </div>
              </div>
            ) : view === "lista" ? (
              <div className="flex-1 overflow-y-auto">
                <ListView tasks={projectTasks} onOpen={openTask} />
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto">
                <CalendarView tasks={projectTasks} onOpen={openTask} />
              </div>
            )}
          </>
        )}
      </main>

      {modalTask !== undefined && (
        <TaskModal
          initial={modalTask.__new ? null : modalTask}
          projectId={selectedProject}
          currentUserId={session.user.id}
          projectTags={tags}
          onClose={() => setModalTask(undefined)}
          onSave={handleSaveTask}
          onDelete={handleDeleteTask}
          onCreateTag={handleCreateTag}
        />
      )}
      {showNewProject && <NewProjectModal onClose={() => setShowNewProject(false)} onCreate={handleCreateProject} />}
      {showEditProject && project && (
        <EditProjectModal
          project={project}
          onClose={() => setShowEditProject(false)}
          onSave={handleUpdateProject}
          onDelete={handleDeleteProject}
        />
      )}
      {showMembers && <MembersModal projectId={selectedProject} currentUserId={session.user.id} onClose={() => setShowMembers(false)} />}
      {contextMenu && contextMenu.type === "project" && (
        <ContextMenu x={contextMenu.x} y={contextMenu.y} onClose={() => setContextMenu(null)}>
          <ContextMenuItem onClick={() => handleEditFromMenu(contextMenu.id)}>Editar projeto</ContextMenuItem>
          <ContextMenuItem danger onClick={() => handleDeleteFromMenu(contextMenu.id)}>
            Eliminar projeto
          </ContextMenuItem>
          <div className="border-t border-slate-100 my-1" />
          <div className="px-3 py-1 text-[10px] uppercase tracking-wide text-slate-400">Mover para pasta</div>
          <ContextMenuItem onClick={() => handleMoveProjectToFolder(contextMenu.id, null)}>Sem pasta</ContextMenuItem>
          {folders.map((f) => (
            <ContextMenuItem key={f.id} onClick={() => handleMoveProjectToFolder(contextMenu.id, f.id)}>
              {f.name}
            </ContextMenuItem>
          ))}
          <ContextMenuItem
            onClick={async () => {
              setContextMenu(null);
              await handleCreateFolder();
            }}
          >
            + Nova pasta...
          </ContextMenuItem>
        </ContextMenu>
      )}
      {contextMenu && contextMenu.type === "folder" && (
        <ContextMenu x={contextMenu.x} y={contextMenu.y} onClose={() => setContextMenu(null)}>
          <ContextMenuItem
            onClick={() => {
              setContextMenu(null);
              handleRenameFolder(contextMenu.folder);
            }}
          >
            Renomear pasta
          </ContextMenuItem>
          <ContextMenuItem danger onClick={() => handleDeleteFolder(contextMenu.folder)}>
            Eliminar pasta
          </ContextMenuItem>
        </ContextMenu>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
