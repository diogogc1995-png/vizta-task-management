function initials(name) {
  return (name || "?").trim().slice(0, 2).toUpperCase();
}
function displayName(p) {
  if (!p) return "Alguém";
  if (p.name && p.name.trim()) return p.name;
  if (p.email) return p.email.split("@")[0];
  return "Alguém";
}
function formatDateBR(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.slice(0, 10).split("-");
  return d + "/" + m + "/" + y;
}
function formatWhen(iso) {
  const d = new Date(iso);
  return (
    d.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" }) +
    " às " +
    d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })
  );
}
function formatBytes(n) {
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

/* ---------- Autenticação ---------- */
function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setInfo("");
    if (!email.trim() || !password.trim() || (mode === "signup" && !name.trim())) {
      setError("Preenche todos os campos para continuar.");
      return;
    }
    setLoading(true);
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({
        email: email.trim(),
        password,
        options: { data: { name: name.trim() } },
      });
      setLoading(false);
      if (error) {
        setError(traduzErro(error.message));
        return;
      }
      if (data.session === null) {
        setInfo("Conta criada! Verifica o teu email para confirmar a conta antes de entrares.");
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      setLoading(false);
      if (error) {
        setError(traduzErro(error.message));
        return;
      }
    }
  }

  function traduzErro(msg) {
    if (/already registered/i.test(msg)) return "Já existe uma conta com este email.";
    if (/invalid login credentials/i.test(msg)) return "Email ou palavra-passe incorretos.";
    if (/email not confirmed/i.test(msg)) return "Confirma o teu email antes de entrares (verifica a caixa de entrada).";
    if (/password should be at least/i.test(msg)) return "A palavra-passe deve ter pelo menos 6 caracteres.";
    return msg;
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-[#F6F5F1] px-4">
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2 mb-8 justify-center">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ backgroundColor: "#1E2A32" }}>
            <IconFolder size={18} style={{ color: "#E1F5EE" }} />
          </div>
          <span className="text-xl font-semibold" style={{ fontFamily: "'Fraunces', serif", color: "#1E2A32" }}>
            Vizta <span className="font-normal text-slate-400">·</span> Task Management
          </span>
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 p-7 shadow-sm">
          <div className="flex mb-5 bg-slate-100 rounded-lg p-1">
            <button
              onClick={() => {
                setMode("login");
                setError("");
                setInfo("");
              }}
              className={"flex-1 text-sm py-1.5 rounded-md font-medium " + (mode === "login" ? "bg-white shadow-sm text-slate-900" : "text-slate-500")}
            >
              Entrar
            </button>
            <button
              onClick={() => {
                setMode("signup");
                setError("");
                setInfo("");
              }}
              className={"flex-1 text-sm py-1.5 rounded-md font-medium " + (mode === "signup" ? "bg-white shadow-sm text-slate-900" : "text-slate-500")}
            >
              Criar conta
            </button>
          </div>
          <form onSubmit={handleSubmit} className="space-y-3">
            {mode === "signup" && (
              <div>
                <label className="text-xs font-medium text-slate-600 mb-1 block">Nome</label>
                <input
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="O teu nome"
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
                />
              </div>
            )}
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Email</label>
              <input
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="nome@empresa.com"
                type="email"
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
              />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Palavra-passe</label>
              <input
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••"
                type="password"
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
              />
            </div>
            {error && <p className="text-xs text-rose-600">{error}</p>}
            {info && <p className="text-xs text-[#F26641]">{info}</p>}
            <button
              type="submit"
              disabled={loading}
              className="w-full text-white rounded-lg py-2.5 text-sm font-medium mt-2 disabled:opacity-50"
              style={{ backgroundColor: "#F26641" }}
            >
              {loading ? "A processar..." : mode === "signup" ? "Criar conta" : "Entrar"}
            </button>
          </form>
        </div>
        <p className="text-[11px] text-slate-400 text-center mt-4 leading-relaxed">
          As contas são reais: a password fica encriptada e os teus dados ficam guardados numa base de dados partilhada, acessível de qualquer dispositivo.
        </p>
      </div>
    </div>
  );
}

/* ---------- Subtarefas ---------- */
function SubtasksSection({ taskId }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [text, setText] = useState("");

  async function load() {
    setLoading(true);
    const { data } = await sb
      .from("subtasks")
      .select("*")
      .eq("task_id", taskId)
      .order("position", { ascending: true })
      .order("created_at", { ascending: true });
    setItems(data || []);
    setLoading(false);
  }
  useEffect(() => {
    load();
  }, [taskId]);

  async function handleAdd(e) {
    e.preventDefault();
    if (!text.trim()) return;
    await sb.from("subtasks").insert({ task_id: taskId, title: text.trim(), position: items.length });
    setText("");
    await load();
  }
  async function toggle(item) {
    setItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, done: !i.done } : i)));
    await sb.from("subtasks").update({ done: !item.done }).eq("id", item.id);
  }
  async function remove(id) {
    await sb.from("subtasks").delete().eq("id", id);
    await load();
  }

  const done = items.filter((i) => i.done).length;
  return (
    <div className="border-t border-slate-100 px-5 py-4">
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs font-medium text-slate-600">Subtarefas</p>
        {items.length > 0 && (
          <span className="text-[10px] text-slate-400">
            {done}/{items.length}
          </span>
        )}
      </div>
      {loading ? (
        <p className="text-xs text-slate-400">A carregar...</p>
      ) : (
        <div className="space-y-1 mb-2">
          {items.map((i) => (
            <div key={i.id} className="flex items-center gap-2 group">
              <input type="checkbox" checked={i.done} onChange={() => toggle(i)} className="accent-[#F26641]" />
              <span className={"flex-1 text-sm " + (i.done ? "line-through text-slate-400" : "text-slate-700")}>{i.title}</span>
              <button onClick={() => remove(i.id)} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100">
                <IconX size={13} />
              </button>
            </div>
          ))}
        </div>
      )}
      <form onSubmit={handleAdd} className="flex gap-2">
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder="Adicionar passo..."
          className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
        />
        <button type="submit" className="text-xs text-white px-3 py-1.5 rounded-lg font-medium shrink-0" style={{ backgroundColor: "#F26641" }}>
          +
        </button>
      </form>
    </div>
  );
}

/* ---------- Anexos ---------- */
function AttachmentsSection({ taskId, currentUserId }) {
  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  async function load() {
    setLoading(true);
    const { data } = await sb
      .from("attachments")
      .select("*")
      .eq("task_id", taskId)
      .is("comment_id", null)
      .order("created_at", { ascending: false });
    const withUrls = await Promise.all(
      (data || []).map(async (f) => {
        const { data: signed } = await sb.storage.from("attachments").createSignedUrl(f.file_path, 3600);
        return { ...f, url: signed?.signedUrl };
      })
    );
    setFiles(withUrls);
    setLoading(false);
  }
  useEffect(() => {
    load();
  }, [taskId]);

  async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const path = taskId + "/" + Date.now() + "_" + file.name;
    const { error } = await sb.storage.from("attachments").upload(path, file);
    if (!error) {
      await sb.from("attachments").insert({
        task_id: taskId,
        uploader_id: currentUserId,
        file_path: path,
        file_name: file.name,
        file_size: file.size,
        mime_type: file.type,
      });
      await load();
    }
    setUploading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }
  async function remove(f) {
    await sb.storage.from("attachments").remove([f.file_path]);
    await sb.from("attachments").delete().eq("id", f.id);
    await load();
  }

  return (
    <div className="border-t border-slate-100 px-5 py-4">
      <p className="text-xs font-medium text-slate-600 mb-2">Anexos</p>
      {loading ? (
        <p className="text-xs text-slate-400">A carregar...</p>
      ) : (
        <div className="space-y-1.5 mb-2">
          {files.length === 0 && <p className="text-xs text-slate-400">Sem anexos.</p>}
          {files.map((f) => (
            <div key={f.id} className="flex items-center gap-2 group bg-slate-50 rounded-lg px-2.5 py-1.5">
              <IconPaperclip size={13} className="text-slate-400 shrink-0" />
              <a href={f.url} target="_blank" rel="noreferrer" className="flex-1 text-sm text-slate-700 truncate hover:underline">
                {f.file_name}
              </a>
              <span className="text-[10px] text-slate-400 shrink-0">{formatBytes(f.file_size)}</span>
              {f.uploader_id === currentUserId && (
                <button onClick={() => remove(f)} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 shrink-0">
                  <IconX size={13} />
                </button>
              )}
            </div>
          ))}
        </div>
      )}
      <label className="inline-flex items-center gap-1.5 text-xs text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 cursor-pointer hover:bg-slate-50">
        <IconPaperclip size={13} /> {uploading ? "A enviar..." : "Anexar ficheiro"}
        <input ref={fileInputRef} type="file" className="hidden" onChange={handleUpload} disabled={uploading} />
      </label>
    </div>
  );
}

/* ---------- Comentários ---------- */
function CommentsSection({ taskId, currentUserId }) {
  const [comments, setComments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [text, setText] = useState("");
  const [posting, setPosting] = useState(false);
  const fileInputRef = useRef(null);
  const [pendingFile, setPendingFile] = useState(null);

  async function loadComments() {
    setLoading(true);
    const { data } = await sb
      .from("task_comments")
      .select("id, body, created_at, author_id, author:profiles(name, email), attachments(id, file_name, file_path)")
      .eq("task_id", taskId)
      .order("created_at", { ascending: true });
    const withUrls = await Promise.all(
      (data || []).map(async (c) => {
        const atts = await Promise.all(
          (c.attachments || []).map(async (a) => {
            const { data: signed } = await sb.storage.from("attachments").createSignedUrl(a.file_path, 3600);
            return { ...a, url: signed?.signedUrl };
          })
        );
        return { ...c, attachments: atts };
      })
    );
    setComments(withUrls);
    setLoading(false);
  }
  useEffect(() => {
    loadComments();
  }, [taskId]);

  async function handlePost(e) {
    e.preventDefault();
    if (!text.trim() && !pendingFile) return;
    setPosting(true);
    const { data: comment, error } = await sb
      .from("task_comments")
      .insert({ task_id: taskId, author_id: currentUserId, body: text.trim() || "(anexo)" })
      .select()
      .single();
    if (!error && comment && pendingFile) {
      const path = taskId + "/" + Date.now() + "_" + pendingFile.name;
      const { error: upErr } = await sb.storage.from("attachments").upload(path, pendingFile);
      if (!upErr) {
        await sb.from("attachments").insert({
          task_id: taskId,
          comment_id: comment.id,
          uploader_id: currentUserId,
          file_path: path,
          file_name: pendingFile.name,
          file_size: pendingFile.size,
          mime_type: pendingFile.type,
        });
      }
    }
    setText("");
    setPendingFile(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
    setPosting(false);
    await loadComments();
  }
  async function handleDelete(id) {
    await sb.from("task_comments").delete().eq("id", id);
    await loadComments();
  }

  return (
    <div className="border-t border-slate-100 px-5 py-4">
      <p className="text-xs font-medium text-slate-600 mb-2">Comentários</p>
      {loading ? (
        <p className="text-xs text-slate-400">A carregar...</p>
      ) : (
        <div className="space-y-3 max-h-48 overflow-y-auto mb-3">
          {comments.length === 0 && <p className="text-xs text-slate-400">Ainda sem comentários.</p>}
          {comments.map((c) => (
            <div key={c.id} className="flex gap-2 group">
              <Avatar name={displayName(c.author)} />
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2">
                  <span className="text-xs font-medium text-slate-800">{displayName(c.author)}</span>
                  <span className="text-[10px] text-slate-400">{formatWhen(c.created_at)}</span>
                  {c.author_id === currentUserId && (
                    <button
                      onClick={() => handleDelete(c.id)}
                      className="text-[10px] text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100"
                    >
                      eliminar
                    </button>
                  )}
                </div>
                <p className="text-sm text-slate-700 whitespace-pre-wrap break-words">{c.body}</p>
                {(c.attachments || []).map((a) => (
                  <a
                    key={a.id}
                    href={a.url}
                    target="_blank"
                    rel="noreferrer"
                    className="inline-flex items-center gap-1 text-xs text-[#F26641] hover:underline mt-1"
                  >
                    <IconPaperclip size={11} /> {a.file_name}
                  </a>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
      <form onSubmit={handlePost} className="space-y-1.5">
        <div className="flex gap-2">
          <input
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder="Escrever um comentário... (usa @email para mencionar)"
            className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
          />
          <button
            type="submit"
            disabled={posting || (!text.trim() && !pendingFile)}
            className="text-sm text-white px-3 py-2 rounded-lg font-medium disabled:opacity-40 shrink-0"
            style={{ backgroundColor: "#F26641" }}
          >
            Enviar
          </button>
        </div>
        <label className="inline-flex items-center gap-1 text-[11px] text-slate-500 cursor-pointer hover:text-slate-700">
          <IconPaperclip size={11} /> {pendingFile ? pendingFile.name : "anexar ficheiro"}
          <input ref={fileInputRef} type="file" className="hidden" onChange={(e) => setPendingFile(e.target.files[0] || null)} />
        </label>
      </form>
    </div>
  );
}

/* ---------- Modal de tarefa ---------- */
function TaskModal({ initial, projectId, currentUserId, projectTags, onClose, onSave, onDelete, onCreateTag }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [column, setColumn] = useState(initial?.column || "todo");
  const [priority, setPriority] = useState(initial?.priority || "media");
  const [assigneeEmails, setAssigneeEmails] = useState((initial?.assignees || []).map((a) => a.email));
  const [newAssigneeEmail, setNewAssigneeEmail] = useState("");
  const [due, setDue] = useState(initial?.due || "");
  const [selectedTagIds, setSelectedTagIds] = useState(initial?.tagIds || []);
  const [newTagName, setNewTagName] = useState("");
  const [recurrence, setRecurrence] = useState(initial?.recurrence || "");
  const [recurrenceWeekday, setRecurrenceWeekday] = useState(initial?.recurrenceWeekday ?? 1);
  const [recurrenceDayOfMonth, setRecurrenceDayOfMonth] = useState(initial?.recurrenceDayOfMonth || 1);
  const [error, setError] = useState("");
  const [saving, setSaving] = useState(false);

  function toggleTag(id) {
    setSelectedTagIds((prev) => (prev.includes(id) ? prev.filter((t) => t !== id) : [...prev, id]));
  }
  function addAssignee(e) {
    e.preventDefault();
    const email = newAssigneeEmail.trim();
    if (!email) return;
    if (!assigneeEmails.includes(email)) setAssigneeEmails((prev) => [...prev, email]);
    setNewAssigneeEmail("");
  }
  function removeAssignee(email) {
    setAssigneeEmails((prev) => prev.filter((e) => e !== email));
  }
  async function handleCreateTag() {
    if (!newTagName.trim()) return;
    const newTag = await onCreateTag(newTagName.trim());
    setNewTagName("");
    if (newTag) setSelectedTagIds((prev) => [...prev, newTag.id]);
  }
  async function handleSave() {
    if (!title.trim()) {
      setError("Dá um título à tarefa.");
      return;
    }
    setSaving(true);
    const result = await onSave({
      id: initial?.id,
      title: title.trim(),
      description: description.trim(),
      column,
      priority,
      assigneeEmails,
      due: due || null,
      project: projectId,
      tagIds: selectedTagIds,
      recurrence: recurrence || null,
      recurrenceWeekday: recurrence === "semanal" ? recurrenceWeekday : null,
      recurrenceDayOfMonth: recurrence === "mensal" ? recurrenceDayOfMonth : null,
    });
    setSaving(false);
    if (result && result.error) setError(result.error);
  }

  return (
    <div
      className="fixed inset-0 bg-black/40 flex items-stretch sm:items-center justify-center z-50 sm:p-4"
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div className="bg-white w-full sm:max-w-lg sm:rounded-xl shadow-xl flex flex-col max-h-full sm:max-h-[90vh] overflow-hidden">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
          <h2 className="text-sm font-semibold text-slate-900">{initial ? "Editar tarefa" : "Nova tarefa"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
            <IconX size={18} />
          </button>
        </div>
        <div className="flex-1 overflow-y-auto">
        <div className="p-5 space-y-4">
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block">Título</label>
            <input
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="Ex: Rever contrato de arrendamento"
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
              autoFocus
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block">Descrição</label>
            <textarea
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Detalhes ou contexto adicional"
              rows={3}
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none resize-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
            />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Coluna</label>
              <select
                value={column}
                onChange={(e) => setColumn(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] bg-white"
              >
                {COLUMN_DEFS.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.title}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Prioridade</label>
              <select
                value={priority}
                onChange={(e) => setPriority(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] bg-white"
              >
                {Object.entries(PRIORITY).map(([k, v]) => (
                  <option key={k} value={k}>
                    {v.label}
                  </option>
                ))}
              </select>
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block">Responsáveis</label>
            {assigneeEmails.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mb-2">
                {assigneeEmails.map((email) => (
                  <span key={email} className="inline-flex items-center gap-1 text-xs bg-slate-100 text-slate-700 px-2 py-1 rounded-full">
                    {email}
                    <button type="button" onClick={() => removeAssignee(email)} className="hover:text-rose-500">
                      <IconX size={11} />
                    </button>
                  </span>
                ))}
              </div>
            )}
            <div className="flex gap-2">
              <input
                value={newAssigneeEmail}
                onChange={(e) => setNewAssigneeEmail(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") addAssignee(e);
                }}
                placeholder="pessoa@empresa.com"
                type="email"
                className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
              />
              <button type="button" onClick={addAssignee} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">
                Adicionar
              </button>
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block">Prazo</label>
            <input
              value={due}
              onChange={(e) => setDue(e.target.value)}
              type="date"
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none appearance-none bg-white text-left min-h-[38px] focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] [&::-webkit-date-and-time-value]:text-left"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block flex items-center gap-1">
              <IconTag size={12} /> Etiquetas
            </label>
            {selectedTagIds.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mb-2">
                {selectedTagIds
                  .map((id) => projectTags.find((t) => t.id === id))
                  .filter(Boolean)
                  .map((t) => (
                    <TagChip key={t.id} tag={t} onRemove={() => toggleTag(t.id)} />
                  ))}
              </div>
            )}
            <select
              value=""
              onChange={(e) => {
                if (e.target.value) toggleTag(e.target.value);
              }}
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none bg-white focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
            >
              <option value="">
                {projectTags.length === 0
                  ? "Ainda não há etiquetas neste projeto"
                  : projectTags.every((t) => selectedTagIds.includes(t.id))
                  ? "Todas as etiquetas adicionadas"
                  : "Adicionar etiqueta existente..."}
              </option>
              {projectTags
                .filter((t) => !selectedTagIds.includes(t.id))
                .map((t) => (
                  <option key={t.id} value={t.id}>
                    {t.name}
                  </option>
                ))}
            </select>
            <div className="flex gap-2 mt-2">
              <input
                value={newTagName}
                onChange={(e) => setNewTagName(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    handleCreateTag();
                  }
                }}
                placeholder="Criar nova etiqueta..."
                className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
              />
              <button type="button" onClick={handleCreateTag} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">
                Criar
              </button>
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block flex items-center gap-1">
              <IconRepeat size={12} /> Repetir
            </label>
            <div className="grid grid-cols-2 gap-3">
              <select
                value={recurrence}
                onChange={(e) => setRecurrence(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] bg-white"
              >
                <option value="">Nunca</option>
                <option value="diaria">Diariamente</option>
                <option value="semanal">Semanalmente</option>
                <option value="mensal">Mensalmente</option>
              </select>
              {recurrence === "semanal" && (
                <select
                  value={recurrenceWeekday}
                  onChange={(e) => setRecurrenceWeekday(Number(e.target.value))}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641] bg-white"
                >
                  {WEEKDAYS.map((w, idx) => (
                    <option key={idx} value={idx}>
                      {w}
                    </option>
                  ))}
                </select>
              )}
              {recurrence === "mensal" && (
                <input
                  type="number"
                  min="1"
                  max="31"
                  value={recurrenceDayOfMonth}
                  onChange={(e) => setRecurrenceDayOfMonth(Number(e.target.value))}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
                  placeholder="Dia do mês"
                />
              )}
            </div>
            {recurrence && (
              <p className="text-[10px] text-slate-400 mt-1">
                Uma nova tarefa é criada automaticamente todos os dias em que a regra se aplicar.
              </p>
            )}
          </div>
          {error && <p className="text-xs text-rose-600">{error}</p>}
        </div>
        {initial?.id && <SubtasksSection taskId={initial.id} />}
        {initial?.id && <AttachmentsSection taskId={initial.id} currentUserId={currentUserId} />}
        {initial?.id && <CommentsSection taskId={initial.id} currentUserId={currentUserId} />}
        {initial?.id && <ActivitySection taskId={initial.id} />}
        </div>
        <div className="flex items-center justify-between gap-2 px-5 py-3 border-t border-slate-100 shrink-0">
          {initial ? (
            <button onClick={() => onDelete(initial.id)} className="text-sm text-rose-600 hover:text-rose-700 flex items-center gap-1.5 shrink-0">
              <IconTrash size={14} /> Eliminar
            </button>
          ) : (
            <span />
          )}
          <div className="flex gap-2">
            <button onClick={onClose} className="text-sm px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100">
              Cancelar
            </button>
            <button
              onClick={handleSave}
              disabled={saving}
              className="text-sm px-4 py-2 rounded-lg text-white font-medium disabled:opacity-50"
              style={{ backgroundColor: "#F26641" }}
            >
              {saving ? "A guardar..." : "Guardar"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Dashboard pessoal ---------- */
function localDateStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function DashboardView({ tasks, projects, onOpen }) {
  const [fTitle, setFTitle] = useState("");
  const [fProject, setFProject] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [fPriority, setFPriority] = useState("");
  const [fDue, setFDue] = useState("");
  const hasFilters = fTitle || fProject || fStatus || fPriority || fDue;
  function clearFilters() {
    setFTitle("");
    setFProject("");
    setFStatus("");
    setFPriority("");
    setFDue("");
  }

  const projectOpts = Array.from(new Set(tasks.map((t) => t.project)))
    .map((pid) => ({ id: pid, name: projects[pid]?.name || "—" }))
    .sort((a, b) => a.name.localeCompare(b.name));

  const today = localDateStr(0);
  const in7 = localDateStr(7);
  function matchesDue(t) {
    const due = t.due ? t.due.slice(0, 10) : null;
    if (fDue === "has") return !!due;
    if (fDue === "none") return !due;
    if (fDue === "overdue") return !!due && due < today && t.column !== "done";
    if (fDue === "today") return due === today;
    if (fDue === "7days") return !!due && due >= today && due <= in7;
    return true;
  }

  const sorted = [...tasks]
    .filter((t) => !fTitle || t.title.toLowerCase().includes(fTitle.toLowerCase()))
    .filter((t) => !fProject || t.project === fProject)
    .filter((t) => !fStatus || t.column === fStatus)
    .filter((t) => !fPriority || t.priority === fPriority)
    .filter(matchesDue)
    .sort((a, b) => ((a.due || "9999") < (b.due || "9999") ? -1 : 1));

  const selCls =
    "w-full text-xs border border-slate-200 rounded-md px-1.5 py-1 outline-none bg-white focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]";

  return (
    <div className="px-4 sm:px-6 py-4">
      <div className="flex items-center justify-between mb-2 text-xs text-slate-400">
        <span>
          {sorted.length === tasks.length ? tasks.length + " tarefas" : sorted.length + " de " + tasks.length + " tarefas"}
        </span>
        {hasFilters && (
          <button onClick={clearFilters} className="text-[#F26641] hover:underline font-medium">
            Limpar filtros
          </button>
        )}
      </div>
      <div className="overflow-x-auto">
       <div className="bg-white rounded-xl border border-slate-200 overflow-hidden min-w-[620px]">
        <div className="grid grid-cols-[1fr_120px_100px_90px_130px] gap-2 px-4 py-2 bg-slate-50 text-[11px] font-medium text-slate-500 uppercase tracking-wide">
          <span>Título</span>
          <span>Projeto</span>
          <span>Status</span>
          <span>Prioridade</span>
          <span>Prazo</span>
        </div>
        <div className="grid grid-cols-[1fr_120px_100px_90px_130px] gap-2 px-4 py-1.5 bg-slate-50 border-t border-slate-100">
          <input
            value={fTitle}
            onChange={(e) => setFTitle(e.target.value)}
            placeholder="Filtrar..."
            className={selCls}
          />
          <select value={fProject} onChange={(e) => setFProject(e.target.value)} className={selCls}>
            <option value="">Todos</option>
            {projectOpts.map((p) => (
              <option key={p.id} value={p.id}>
                {p.name}
              </option>
            ))}
          </select>
          <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className={selCls}>
            <option value="">Todos</option>
            {COLUMN_DEFS.map((c) => (
              <option key={c.id} value={c.id}>
                {c.title}
              </option>
            ))}
          </select>
          <select value={fPriority} onChange={(e) => setFPriority(e.target.value)} className={selCls}>
            <option value="">Todas</option>
            {Object.entries(PRIORITY).map(([k, v]) => (
              <option key={k} value={k}>
                {v.label}
              </option>
            ))}
          </select>
          <select value={fDue} onChange={(e) => setFDue(e.target.value)} className={selCls}>
            <option value="">Qualquer</option>
            <option value="overdue">Atrasadas</option>
            <option value="today">Hoje</option>
            <option value="7days">Próx. 7 dias</option>
            <option value="has">Com prazo</option>
            <option value="none">Sem prazo</option>
          </select>
        </div>
        {sorted.length === 0 && (
          <p className="text-sm text-slate-400 text-center py-8">
            {tasks.length === 0
              ? "Não tens tarefas atribuídas em nenhum projeto."
              : "Nenhuma tarefa corresponde aos filtros."}
          </p>
        )}
        {sorted.map((t) => {
          const pr = PRIORITY[t.priority] || PRIORITY.media;
          const col = COLUMN_DEFS.find((c) => c.id === t.column);
          const style = COLUMN_STYLES[t.column] || COLUMN_STYLES.todo;
          const proj = projects[t.project];
          return (
            <div
              key={t.id}
              onClick={() => onOpen(t)}
              className={
                "grid grid-cols-[1fr_120px_100px_90px_130px] gap-2 px-4 py-2.5 border-t border-slate-100 hover:bg-slate-50 cursor-pointer items-center " +
                (t.column === "done" ? "bg-emerald-50/30" : "")
              }
            >
              <div className="min-w-0">
                <p className="text-sm text-slate-800 truncate">{t.title}</p>
                {t.tags && t.tags.length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1">
                    {t.tags.map((tag) => (
                      <TagChip key={tag.id} tag={tag} />
                    ))}
                  </div>
                )}
              </div>
              <span className="flex items-center gap-1.5 text-xs text-slate-600 truncate">
                <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ backgroundColor: proj?.color }} /> {proj?.name}
              </span>
              <span className={"text-[11px] px-1.5 py-0.5 rounded font-medium w-fit " + style.pillBg + " " + style.text}>{col?.title}</span>
              <span className={"text-[11px] px-1.5 py-0.5 rounded font-medium w-fit " + pr.bg + " " + pr.text}>{pr.label}</span>
              {t.column === "done" && t.completedAt ? (
                <span className="text-xs text-emerald-600 font-medium">Concluída {formatDateBR(t.completedAt)}</span>
              ) : (
                <span className="text-xs text-slate-500">{t.due ? formatDateBR(t.due) : "—"}</span>
              )}
            </div>
          );
        })}
       </div>
      </div>
    </div>
  );
}

function MembersModal({ projectId, currentUserId, onClose }) {
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [email, setEmail] = useState("");
  const [error, setError] = useState("");
  const [inviting, setInviting] = useState(false);

  async function loadMembers() {
    setLoading(true);
    const { data } = await sb.from("project_members").select("user_id, profiles(name, email)").eq("project_id", projectId);
    setMembers(data || []);
    setLoading(false);
  }
  useEffect(() => {
    loadMembers();
  }, [projectId]);

  async function handleInvite(e) {
    e.preventDefault();
    setError("");
    if (!email.trim()) return;
    setInviting(true);
    const { data: found } = await sb.from("profiles").select("id").eq("email", email.trim()).maybeSingle();
    if (!found) {
      setInviting(false);
      setError("Não encontrei nenhuma conta com esse email. A pessoa precisa de se registar primeiro.");
      return;
    }
    const { error: insErr } = await sb
      .from("project_members")
      .upsert({ project_id: projectId, user_id: found.id }, { onConflict: "project_id,user_id" });
    setInviting(false);
    if (insErr) {
      setError(insErr.message);
      return;
    }
    setEmail("");
    await loadMembers();
  }
  async function handleRemove(userId) {
    await sb.from("project_members").delete().eq("project_id", projectId).eq("user_id", userId);
    await loadMembers();
  }

  return (
    <div
      className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 overflow-y-auto"
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div className="bg-white rounded-xl w-full max-w-sm shadow-xl">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h2 className="text-sm font-semibold text-slate-900">Equipa do projeto</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
            <IconX size={18} />
          </button>
        </div>
        <div className="p-5">
          <form onSubmit={handleInvite} className="flex gap-2 mb-4">
            <input
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="email@empresa.com"
              type="email"
              className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#F26641]/30 focus:border-[#F26641]"
            />
            <button
              type="submit"
              disabled={inviting}
              className="text-sm text-white px-3 py-2 rounded-lg font-medium disabled:opacity-50 shrink-0"
              style={{ backgroundColor: "#F26641" }}
            >
              {inviting ? "..." : "Convidar"}
            </button>
          </form>
          {error && <p className="text-xs text-rose-600 mb-3">{error}</p>}
          {loading ? (
            <p className="text-xs text-slate-400">A carregar...</p>
          ) : (
            <div className="space-y-1.5 max-h-64 overflow-y-auto">
              {members.length === 0 && <p className="text-xs text-slate-400">Ainda não convidaste ninguém.</p>}
              {members.map((m) => (
                <div key={m.user_id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50">
                  <Avatar name={displayName(m.profiles)} />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm text-slate-800 truncate">{displayName(m.profiles)}</p>
                    <p className="text-[11px] text-slate-400 truncate">{m.profiles?.email}</p>
                  </div>
                  {m.user_id !== currentUserId && (
                    <button onClick={() => handleRemove(m.user_id)} className="text-slate-300 hover:text-rose-500" title="Remover">
                      <IconX size={14} />
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- Notificações ---------- */
function NotificationsBell({ userId, onOpenTask }) {
  const [open, setOpen] = useState(false);
  const [items, setItems] = useState([]);
  const [unread, setUnread] = useState(0);
  const boxRef = useRef(null);

  async function loadUnreadCount() {
    const { count } = await sb.from("notifications").select("id", { count: "exact", head: true }).eq("user_id", userId).eq("read", false);
    setUnread(count || 0);
  }
  async function loadList() {
    const { data } = await sb.from("notifications").select("*").eq("user_id", userId).order("created_at", { ascending: false }).limit(20);
    setItems(data || []);
  }
  useEffect(() => {
    loadUnreadCount();
    const interval = setInterval(loadUnreadCount, 30000);
    return () => clearInterval(interval);
  }, [userId]);
  useEffect(() => {
    function onDocClick(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);

  async function handleToggle() {
    const next = !open;
    setOpen(next);
    if (next) await loadList();
  }
  async function handleClickItem(n) {
    if (!n.read) {
      await sb.from("notifications").update({ read: true }).eq("id", n.id);
      setItems((prev) => prev.map((i) => (i.id === n.id ? { ...i, read: true } : i)));
      setUnread((u) => Math.max(0, u - 1));
    }
    if (n.task_id) onOpenTask(n.task_id, n.body?.split(" — ")[1] || null);
    setOpen(false);
  }
  async function markAllRead() {
    await sb.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
    setItems((prev) => prev.map((i) => ({ ...i, read: true })));
    setUnread(0);
  }

  return (
    <div className="relative" ref={boxRef}>
      <button onClick={handleToggle} className="relative text-slate-500 hover:text-slate-700 p-1.5">
        <IconBell size={18} />
        {unread > 0 && (
          <span className="absolute -top-0.5 -right-0.5 bg-[#F26641] text-white text-[9px] rounded-full min-w-[15px] h-[15px] flex items-center justify-center px-1">
            {unread > 9 ? "9+" : unread}
          </span>
        )}
      </button>
      {open && (
        <div className="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-slate-200 z-50 max-h-96 overflow-y-auto">
          <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100">
            <span className="text-sm font-semibold text-slate-900">Notificações</span>
            {unread > 0 && (
              <button onClick={markAllRead} className="text-[11px] text-[#F26641] hover:underline">
                marcar todas como lidas
              </button>
            )}
          </div>
          {items.length === 0 && <p className="text-xs text-slate-400 px-4 py-6 text-center">Sem notificações.</p>}
          {items.map((n) => (
            <button
              key={n.id}
              onClick={() => handleClickItem(n)}
              className={"w-full text-left px-4 py-2.5 border-b border-slate-50 hover:bg-slate-50 " + (n.read ? "" : "bg-[#F26641]/5")}
            >
              <p className="text-xs font-medium text-slate-800">{n.title}</p>
              {n.body && <p className="text-[11px] text-slate-500 truncate">{n.body}</p>}
              <p className="text-[10px] text-slate-400 mt-0.5">{formatWhen(n.created_at)}</p>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

          +{people.length - 3}

      )}
    </div>
  );
}
function TaskCard({ task, onOpen, onDragStart }) {
  const pr = PRIORITY[task.priority] || PRIORITY.media;
  const isOverdue = task.due && task.column !== "done" && new Date(task.due) < new Date(new Date().toDateString());
  const subtasksTotal = task.subtasksTotal || 0;
  const subtasksDone = task.subtasksDone || 0;
  const colStyle = COLUMN_STYLES[task.column] || COLUMN_STYLES.todo;
  return (
    <div
      draggable
      onDragStart={(e) => onDragStart(e, task.id)}
      onClick={() => onOpen(task)}
      className={
        "border rounded-lg p-3 mb-2 cursor-pointer hover:shadow-sm transition group " +
        (task.column === "done" ? "bg-emerald-50/40 border-emerald-200" : "bg-white border-slate-200 hover:border-slate-300")
      }
    >
      <div className="flex items-start justify-between gap-2 mb-2">
        <p className="text-sm text-slate-800 font-medium leading-snug">{task.title}</p>
        <IconGrip size={14} className="text-slate-300 opacity-0 group-hover:opacity-100 shrink-0 mt-0.5" />
      </div>
      {task.tags && task.tags.length > 0 && (
        <div className="flex flex-wrap gap-1 mb-2">
          {task.tags.map((t) => (
            <TagChip key={t.id} tag={t} />
          ))}
        </div>
      )}
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2 flex-wrap">
          <span className={"text-[11px] px-1.5 py-0.5 rounded font-medium " + pr.bg + " " + pr.text}>{pr.label}</span>
          {task.column === "done" && task.completedAt ? (
            <span className="text-[11px] flex items-center gap-1 text-emerald-600 font-medium">
              <IconCalendar size={11} /> Concluída {formatDateBR(task.completedAt)}
            </span>
          ) : (
            task.due && (
              <span className={"text-[11px] flex items-center gap-1 " + (isOverdue ? "text-rose-600 font-medium" : "text-slate-400")}>
                <IconCalendar size={11} /> {formatDateBR(task.due)}
              </span>
            )
          )}
          {task.recurrence && <IconRepeat size={11} className="text-slate-400" />}
          {subtasksTotal > 0 && (
            <span className="text-[11px] text-slate-400 flex items-center gap-1">

            </span>
          )}
        </div>
        <AvatarStack people={task.assignees} />
      </div>
    </div>
  );
}
function Column({ col, tasks, onOpen, onDragStart, onDrop, onAddTask }) {
  const [over, setOver] = useState(false);

    <div

      onDragOver={(e) => {
        e.preventDefault();
        setOver(true);
      }}
      onDragLeave={() => setOver(false)}

        setOver(false);
        onDrop(e, col.id);
      }}
    >
      <div className="flex items-center justify-between px-2 py-1.5 mb-1">
        <div className="flex items-center gap-2">
          <span className="w-2 h-2 rounded-full" style={{ backgroundColor: style.chip }} />

/* ---------- Vista de Calendário ---------- */
function CalendarView({ tasks, onOpen }) {
  const [cursor, setCursor] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d;
  });
  const year = cursor.getFullYear(),
    month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const tasksByDay = {};
  tasks.forEach((t) => {
    if (!t.due) return;
    const [y, m, d] = t.due.split("-").map(Number);
    if (y === year && m === month + 1) {
      tasksByDay[d] = tasksByDay[d] || [];
      tasksByDay[d].push(t);
    }
  });
  return (
    <div className="px-4 sm:px-6 py-4">
      <div className="flex items-center justify-between mb-3">
        <span className="text-sm font-semibold text-slate-800 inline-block first-letter:uppercase">
          {cursor.toLocaleDateString("pt-PT", { month: "long", year: "numeric" })}
        </span>
        <div className="flex gap-1">
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="p-1 rounded hover:bg-slate-100 text-slate-500">
            <IconChevronLeft size={16} />
          </button>
          <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="p-1 rounded hover:bg-slate-100 text-slate-500">
            <IconChevronRight size={16} />
          </button>
        </div>
      </div>
      <div className="overflow-x-auto">
       <div className="min-w-[560px]">
        <div className="grid grid-cols-7 gap-1 text-[11px] text-slate-400 mb-1 px-1">
          {["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((d) => (
            <div key={d} className="text-center">
              {d}
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, idx) => (
            <div key={idx} className={"min-h-[80px] rounded-lg border p-1 " + (d ? "border-slate-200 bg-white" : "border-transparent")}>
              {d && (
                <>
                  <p className="text-[11px] text-slate-400 mb-1">{d}</p>
                {(tasksByDay[d] || []).slice(0, 3).map((t) => {
                  const style = COLUMN_STYLES[t.column] || COLUMN_STYLES.todo;
                  return (
                    <div
                      key={t.id}
                      onClick={() => onOpen(t)}
                      className="text-[10px] px-1 py-0.5 mb-0.5 rounded truncate cursor-pointer"
                      style={{ backgroundColor: style.chip + "20", color: style.chip }}
                    >
                      {t.title}
                    </div>
                  );
                })}
                {(tasksByDay[d] || []).length > 3 && (
                  <p className="text-[9px] text-slate-400">+{(tasksByDay[d] || []).length - 3} mais</p>
                )}
              </>
            )}
          </div>
          ))}
        </div>
       </div>
      </div>
    </div>
  );
}

/* ---------- App principal ---------- */
function App() {
  const [session, setSession] = useState(undefined);

  const [modalTask, setModalTask] = useState(undefined);
  const [showNewProject, setShowNewProject] = useState(false);
  const [showEditProject, setShowEditProject] = useState(false);
  const [showMembers, setShowMembers] = useState(false);
  const [search, setSearch] = useState("");
  const [view, setView] = useState("kanban");
  const [filterAssignee, setFilterAssignee] = useState("");
  const [filterPriority, setFilterPriority] = useState("");
  const [filterTagId, setFilterTagId] = useState("");
  const [filterColumn, setFilterColumn] = useState("");
  const [sortBy, setSortBy] = useState("");
  const [members, setMembers] = useState([]);
  const [loadingData, setLoadingData] = useState(false);
  const [contextMenu, setContextMenu] = useState(null);
  const [showDashboard, setShowDashboard] = useState(false);
  const [folders, setFolders] = useState([]);
  const [folderAssignments, setFolderAssignments] = useState({});
  const [collapsedFolders, setCollapsedFolders] = useState({});
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [dragProjectId, setDragProjectId] = useState(null);
  const [dragOverFolder, setDragOverFolder] = useState(undefined);
  const dragTaskId = useRef(null);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    if (!session) {
      setProfile(null);
      return;
    }
    sb.from("profiles").select("*").eq("id", session.user.id).single().then(({ data }) => setProfile(data));
  }, [session]);

  async function loadData() {
    setLoadingData(true);
    const { data: projectRows } = await sb.from("projects").select("*").order("created_at", { ascending: true });
    const { data: taskRows } = await sb
      .from("tasks")
      .select("*, task_assignees(profiles(id,name,email)), task_tags(tags(id,name,color)), subtasks(id,done)")
      .order("created_at", { ascending: true });
    const projMap = {};
    const order = [];
    (projectRows || []).forEach((p) => {
      projMap[p.id] = p;
      order.push(p.id);
    });
    const taskMap = {};
    (taskRows || []).forEach((t) => {
      const assignees = (t.task_assignees || []).map((a) => a.profiles).filter(Boolean);
      taskMap[t.id] = {
        id: t.id,
        title: t.title,
        description: t.description || "",
        column: t.column_id,
        priority: t.priority,
        due: t.due,
        completedAt: t.completed_at,
        project: t.project_id,
        assignees,
        tags: (t.task_tags || []).map((tt) => tt.tags).filter(Boolean),
        tagIds: (t.task_tags || []).map((tt) => tt.tags?.id).filter(Boolean),
        subtasksTotal: (t.subtasks || []).length,
        subtasksDone: (t.subtasks || []).filter((s) => s.done).length,
        recurrence: t.recurrence,
        recurrenceWeekday: t.recurrence_weekday,
        recurrenceDayOfMonth: t.recurrence_day_of_month,
      };
    });
    setProjects(projMap);
    setProjectOrder(order);
    setTasks(taskMap);
    setSelectedProject((prev) => (prev && projMap[prev] ? prev : order[0] || null));
    setLoadingData(false);
  }
  useEffect(() => {
    if (session && profile) loadData();
  }, [session, profile]);

  async function loadFolders() {
    const { data: folderRows } = await sb
      .from("sidebar_folders")
      .select("*")
      .order("position", { ascending: true })
      .order("created_at", { ascending: true });
    const { data: assignRows } = await sb.from("project_folder_assignments").select("project_id, folder_id");
    setFolders(folderRows || []);
    const map = {};
    (assignRows || []).forEach((a) => {
      map[a.project_id] = a.folder_id;
    });
    setFolderAssignments(map);
  }
  useEffect(() => {
    if (session) loadFolders();
  }, [session]);

  async function handleCreateFolder() {
    const name = window.prompt("Nome da nova pasta:");
    if (!name || !name.trim()) return;
    await sb.from("sidebar_folders").insert({ owner_id: session.user.id, name: name.trim() });
    await loadFolders();
  }
  async function handleRenameFolder(folder) {
    const name = window.prompt("Novo nome da pasta:", folder.name);
    if (!name || !name.trim()) return;
    await sb.from("sidebar_folders").update({ name: name.trim() }).eq("id", folder.id);
    await loadFolders();
  }
  async function handleDeleteFolder(folder) {
    if (!window.confirm('Eliminar a pasta "' + folder.name + '"? Os projetos lá dentro voltam a ficar sem pasta.')) return;
    await sb.from("sidebar_folders").delete().eq("id", folder.id);
    await loadFolders();
    setContextMenu(null);
  }
  async function handleMoveProjectToFolder(projectId, folderId) {
    if (folderId) {
      await sb
        .from("project_folder_assignments")
        .upsert({ owner_id: session.user.id, project_id: projectId, folder_id: folderId }, { onConflict: "owner_id,project_id" });
    } else {
      await sb.from("project_folder_assignments").delete().eq("owner_id", session.user.id).eq("project_id", projectId);
    }
    await loadFolders();
    setContextMenu(null);
  }
  async function handleDropProjectOnFolder(folderId) {
    const pid = dragProjectId;
    setDragProjectId(null);
    setDragOverFolder(undefined);
    if (!pid) return;
    const current = folderAssignments[pid] || null;
    if (current === (folderId || null)) return;
    await handleMoveProjectToFolder(pid, folderId);
  }

  async function loadTags(projectId) {
    const { data } = await sb.from("tags").select("*").eq("project_id", projectId).order("name");
    setTags(data || []);
  }
  async function loadMembers(projectId) {
    const { data } = await sb.from("project_members").select("user_id, profiles(name,email)").eq("project_id", projectId);
    setMembers((data || []).map((m) => m.profiles).filter(Boolean));
  }
  useEffect(() => {
    if (selectedProject) {
      loadTags(selectedProject);
      loadMembers(selectedProject);
    }
  }, [selectedProject]);

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center bg-[#F6F5F1] text-slate-400 text-sm">A carregar...</div>;
  }
  if (!session) return <AuthScreen />;
  if (!profile || loadingData) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F6F5F1] text-slate-400 text-sm">A carregar os teus dados...</div>
    );
  }

  const project = selectedProject ? projects[selectedProject] : null;
  const myTasks = Object.values(tasks).filter((t) => (t.assignees || []).some((a) => a.id === session.user.id));
  const allProjectTasksUnfiltered = Object.values(tasks).filter((t) => t.project === selectedProject);
  const assigneeOptions = [];
  const seenEmails = new Set();
  allProjectTasksUnfiltered.forEach((t) =>
    (t.assignees || []).forEach((a) => {
      if (a.email && !seenEmails.has(a.email)) {
        seenEmails.add(a.email);
        assigneeOptions.push(a);
      }
    })
  );
  let projectTasks = allProjectTasksUnfiltered.filter(
    (t) => search.trim() === "" || t.title.toLowerCase().includes(search.toLowerCase())
  );
  if (filterAssignee) projectTasks = projectTasks.filter((t) => (t.assignees || []).some((a) => a.email === filterAssignee));
  if (filterPriority) projectTasks = projectTasks.filter((t) => t.priority === filterPriority);
  if (filterTagId) projectTasks = projectTasks.filter((t) => (t.tagIds || []).includes(filterTagId));
  if (filterColumn) projectTasks = projectTasks.filter((t) => t.column === filterColumn);
  if (sortBy === "due") projectTasks = [...projectTasks].sort((a, b) => ((a.due || "9999") < (b.due || "9999") ? -1 : 1));
  if (sortBy === "priority") projectTasks = [...projectTasks].sort((a, b) => PRIORITY[b.priority].order - PRIORITY[a.priority].order);
  if (sortBy === "title") projectTasks = [...projectTasks].sort((a, b) => a.title.localeCompare(b.title));

  async function handleSaveTask(task) {
    const assigneeIds = [];
    for (const email of task.assigneeEmails) {
      const { data: found } = await sb.from("profiles").select("id").eq("email", email).maybeSingle();
      if (!found) return { error: "Não encontrei nenhuma conta com o email " + email + "." };
      assigneeIds.push(found.id);
    }
    const payload = {
      project_id: task.project,
      title: task.title,
      description: task.description,
      column_id: task.column,
      priority: task.priority,
      due: task.due,
      recurrence: task.recurrence,
      recurrence_weekday: task.recurrenceWeekday,
      recurrence_day_of_month: task.recurrenceDayOfMonth,
      is_recurring_template: !!task.recurrence,
    };
    let taskId = task.id;
    let error;
    if (task.id) {
      ({ error } = await sb.from("tasks").update(payload).eq("id", task.id));
    } else {
      payload.created_by = session.user.id;
      const { data, error: insErr } = await sb.from("tasks").insert(payload).select().single();
      error = insErr;
      if (data) taskId = data.id;
    }
    if (error) return { error: error.message };
    if (taskId) {
      const { data: existingLinks } = await sb.from("task_tags").select("tag_id").eq("task_id", taskId);
      const existingIds = (existingLinks || []).map((l) => l.tag_id);
      const toAdd = task.tagIds.filter((id) => !existingIds.includes(id));
      const toRemove = existingIds.filter((id) => !task.tagIds.includes(id));
      if (toAdd.length) await sb.from("task_tags").insert(toAdd.map((tag_id) => ({ task_id: taskId, tag_id })));
      if (toRemove.length) await sb.from("task_tags").delete().eq("task_id", taskId).in("tag_id", toRemove);
      const { data: existingAssignees } = await sb.from("task_assignees").select("user_id").eq("task_id", taskId);
      const existingAssigneeIds = (existingAssignees || []).map((a) => a.user_id);
      const assigneesToAdd = assigneeIds.filter((id) => !existingAssigneeIds.includes(id));
      const assigneesToRemove = existingAssigneeIds.filter((id) => !assigneeIds.includes(id));
      if (assigneesToAdd.length) await sb.from("task_assignees").insert(assigneesToAdd.map((user_id) => ({ task_id: taskId, user_id })));
      if (assigneesToRemove.length) await sb.from("task_assignees").delete().eq("task_id", taskId).in("user_id", assigneesToRemove);
    }
    await loadData();
    setModalTask(undefined);
  }
